# T1 (docs/IMPROVEMENTS.md): the full test tier on every push to main and on every pull request.
# The dev runs `npm test` (the fast tier, about 3 minutes) before pushing; this runs everything (`npm run test:full`).
name: tests
on:
  push:
    branches: [main]
    # (v9.17.6: a docs-only or skills-only push doesn't run the suite; docs the tests read still do: the
    # screenshot baselines, census, game text and Studio ids under docs/review, the sound list under docs/audio)
    paths: ['**', '!docs/**', '!.claude/**', 'docs/review/**', 'docs/audio/**']
  pull_request:
    paths: ['**', '!docs/**', '!.claude/**', 'docs/review/**', 'docs/audio/**']
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-24.04   # (ubuntu-latest is 26.04: the pinned Playwright has no Chromium for it)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # (v9.17.6) the same fonts as the machine the screenshot baselines were made on: Inter, preferred for sans-serif,
      # drawn unhinted in grayscale. Without them the text falls back to DejaVu Sans (world and Jumu'ah frames 0.5-1.8%
      # off); with Inter but hinted, glyph edges still differ (0.2-0.7%).
      - name: Fonts as on the baseline machine
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter
          sudo cp tests/ci/56-prefer-inter.conf tests/ci/12-unhinted-grayscale.conf /etc/fonts/conf.d/
          fc-cache -f
          fc-match sans-serif
      - run: npm run test:full
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/output/
          if-no-files-found: ignore
